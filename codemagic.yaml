# Tradies Toolbox — signed iOS IPA on Codemagic (no local Mac).
#
# Workflow: ios-app-store
# Instance: mac_mini_m2 (free tier: 500 Mac M2 min/month, then ~$0.095/min)
#
# Secrets stay in the Codemagic UI. Do not put .p8 / .p12 / passwords here.
# Setup: docs/ios-codemagic.md
#
# Placeholders Josh fills in the Codemagic UI (or uncomments below):
#   integrations.app_store_connect  → ASC API key name (e.g. tradies-toolbox-asc)
#   environment.groups              → app_store_credentials (optional env-var path)
#   APP_STORE_APPLE_ID              → numeric Apple ID from App Store Connect
#   PUBLISH_TESTFLIGHT              → "true" to upload IPA to TestFlight when ASC is present

workflows:
  ios-app-store:
    name: iOS App Store IPA
    instance_type: mac_mini_m2
    max_build_duration: 90

    # Uncomment after adding an App Store Connect API key in
    # Codemagic → Team settings → Team integrations → Developer Portal.
    # The name here must match the key name in the UI exactly.
    # integrations:
    #   app_store_connect: tradies-toolbox-asc

    environment:
      # Fetches Apple Distribution cert + App Store profile from
      # Codemagic → Team settings → Code signing identities
      # (upload files, or Generate / Fetch via the ASC API key).
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.josh12891.tradiestoolbox

      # Uncomment if you stored ASC secrets in a Team/Application group
      # named app_store_credentials instead of Team integrations.
      # Expected secret names (never commit values):
      #   APP_STORE_CONNECT_ISSUER_ID
      #   APP_STORE_CONNECT_KEY_IDENTIFIER
      #   APP_STORE_CONNECT_PRIVATE_KEY
      #   CERTIFICATE_PRIVATE_KEY   # only if generating a cert via CLI
      #   APP_STORE_APPLE_ID
      # groups:
      #   - app_store_credentials

      vars:
        BUNDLE_ID: com.josh12891.tradiestoolbox
        XCODE_WORKSPACE: App.xcworkspace
        XCODE_SCHEME: App
        # Numeric Apple ID: App Store Connect → Tradies Toolbox → App Information.
        # Set this in the Codemagic UI (Application variables) once the app exists.
        APP_STORE_APPLE_ID: ""
        # "true" = upload IPA to App Store Connect / TestFlight when ASC creds exist.
        # "false" = build the signed IPA only (artifact still downloadable).
        PUBLISH_TESTFLIGHT: "true"
      node: 22
      xcode: latest
      cocoapods: default

    cache:
      cache_paths:
        - $HOME/.npm
        - $CM_BUILD_DIR/node_modules
        - $HOME/Library/Caches/CocoaPods
        - $CM_BUILD_DIR/ios/App/Pods

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Build web
        script: |
          npm run build
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Set up code signing
        script: |
          set -euo pipefail
          # Automatic signing via ASC API when the key is present in this environment
          # (Team integration injects these, or set them as Application secrets).
          if [[ -n "${APP_STORE_CONNECT_PRIVATE_KEY:-}" \
             && -n "${APP_STORE_CONNECT_KEY_IDENTIFIER:-}" \
             && -n "${APP_STORE_CONNECT_ISSUER_ID:-}" ]]; then
            echo "ASC API key present — fetching/creating App Store signing files for $BUNDLE_ID"
            app-store-connect fetch-signing-files "$BUNDLE_ID" \
              --type IOS_APP_STORE \
              --create
            keychain add-certificates
          else
            echo "No ASC API key in this environment — using Code signing identities (ios_signing)."
          fi
          xcode-project use-profiles
      - name: Increment iOS build number
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/ios/App"
          BUILD_NUM="${BUILD_NUMBER:-1}"
          APPLE_ID="${APP_STORE_APPLE_ID:-}"
          if [[ "$APPLE_ID" == \$APP_STORE_APPLE_ID ]]; then
            APPLE_ID=""
          fi
          if [[ -n "$APPLE_ID" \
             && -n "${APP_STORE_CONNECT_KEY_IDENTIFIER:-}" \
             && -n "${APP_STORE_CONNECT_ISSUER_ID:-}" \
             && -n "${APP_STORE_CONNECT_PRIVATE_KEY:-}" ]]; then
            LATEST="$(app-store-connect get-latest-testflight-build-number "$APPLE_ID" || true)"
            if [[ -z "${LATEST:-}" ]]; then
              LATEST="$(app-store-connect get-latest-app-store-build-number "$APPLE_ID" || true)"
            fi
            if [[ -n "${LATEST:-}" ]]; then
              BUILD_NUM="$((LATEST + 1))"
            fi
          fi
          echo "Using CFBundleVersion $BUILD_NUM"
          agvtool new-version -all "$BUILD_NUM"
      - name: Build signed App Store IPA
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/ios/App"
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      # Native publisher (uncomment after integrations.app_store_connect is set):
      # app_store_connect:
      #   auth: integration
      #   submit_to_testflight: true
      #   submit_to_app_store: false
      scripts:
        - name: Publish to TestFlight when ASC credentials are present
          script: |
            set -euo pipefail
            IPA="$(find "$CM_BUILD_DIR/ios/App/build/ios/ipa" -name '*.ipa' | head -1 || true)"
            if [[ -z "${IPA:-}" ]]; then
              echo "No IPA found — skip TestFlight."
              exit 0
            fi
            if [[ "${PUBLISH_TESTFLIGHT:-false}" != "true" ]]; then
              echo "PUBLISH_TESTFLIGHT is not true — skip TestFlight. IPA is a Codemagic artifact."
              exit 0
            fi
            if [[ -z "${APP_STORE_CONNECT_PRIVATE_KEY:-}" \
               || -z "${APP_STORE_CONNECT_KEY_IDENTIFIER:-}" \
               || -z "${APP_STORE_CONNECT_ISSUER_ID:-}" ]]; then
              echo "No App Store Connect API key in this environment — skip TestFlight."
              echo "Add Team integrations → Developer Portal key 'tradies-toolbox-asc'"
              echo "or set APP_STORE_CONNECT_ISSUER_ID / KEY_IDENTIFIER / PRIVATE_KEY."
              echo "Signed IPA remains available as a build artifact."
              exit 0
            fi
            echo "Uploading $IPA to App Store Connect (TestFlight processing)…"
            app-store-connect publish --path "$IPA"
